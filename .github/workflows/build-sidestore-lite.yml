name: Build SideStore Lite iPadOS concert house

on:
  workflow_dispatch:
  push:
    branches: [sidestore-lite]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout SideStore Lite source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Checkout current concert-house source of truth
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SITE="$RUNNER_TEMP/bryanmackayne-source"
          rm -rf "$SOURCE_SITE"
          git clone --depth 1 https://github.com/bryanzzai/bryanmackayne.git "$SOURCE_SITE"
          git -C "$SOURCE_SITE" rev-parse HEAD | tee SOURCE-SITE-COMMIT.txt

      - name: Generate corrected Dies Apri catalog
        shell: bash
        run: |
          set -euo pipefail
          node Scripts/generate_full_catalog.mjs \
            --source "$RUNNER_TEMP/bryanmackayne-source" \
            --output-swift "$PWD/App/Sources/Catalog.generated.swift" \
            --output-manifest "$PWD/App/Generated/ResourceManifest.tsv" \
            --output-report "$PWD/App/Generated/CatalogReport.txt"
          cat App/Generated/CatalogReport.txt
          grep -q 'dies-apri' App/Generated/ResourceManifest.tsv
          grep -q 'Audio: 245' App/Generated/CatalogReport.txt

      - name: Generate Xcode 15 compatible project
        run: |
          xcodegen generate
          test -d The12DayDancer.xcodeproj
          grep -q 'objectVersion = 60;' The12DayDancer.xcodeproj/project.pbxproj
          grep -q 'compatibilityVersion = "Xcode 15.0";' The12DayDancer.xcodeproj/project.pbxproj
          if grep -q 'preferredProjectObjectVersion' The12DayDancer.xcodeproj/project.pbxproj; then
            echo 'Xcode 16 preferredProjectObjectVersion leaked into Xcode 15 project.' >&2
            exit 1
          fi

      - name: Compile SideStore Lite app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project The12DayDancer.xcodeproj \
            -scheme The12DayDancer \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-sidestore-lite.log

      - name: Verify Lite app contains no concert media
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*Build/Products/Debug-iphoneos/The 12 Day Dancer.app' -print -quit)
          test -n "$APP"
          RES="$APP/ConcertResources"
          test -d "$RES"
          test -s "$RES/facade__background__bulgarian-ballerina.png"
          test -s "$RES/SOURCE-SITE-COMMIT.txt"

          audio_count=$(find "$APP" -type f -name '*.m4a' | wc -l | tr -d ' ')
          video_count=$(find "$APP" -type f -name '*.mp4' | wc -l | tr -d ' ')
          resource_count=$(find "$RES" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$audio_count" = 0
          test "$video_count" = 0
          test "$resource_count" = 2

          grep -q 'SIDESTORE-LITE-RESOURCE-ROOT' App/Sources/The12DayDancerApp.swift
          /usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$APP/Info.plist" | grep -q true
          /usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$APP/Info.plist" | grep -q true

          size_mb=$(du -sm "$APP" | awk '{print $1}')
          test "$size_mb" -lt 100
          echo "SideStore Lite built app: $APP"
          echo "Lite validation: 0 M4A; 0 MP4; 2 bootstrap files; external Documents resolver; Finder file sharing enabled; ${size_mb} MB."

      - name: Package unsigned SideStore IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*Build/Products/Debug-iphoneos/The 12 Day Dancer.app' -print -quit)
          test -n "$APP"
          IPA_ROOT="$RUNNER_TEMP/side-store-ipa"
          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload" delivery
          cp -R "$APP" "$IPA_ROOT/Payload/"
          (cd "$IPA_ROOT" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/delivery/The-12-Day-Dancer-Dies-Apri-24-UNSIGNED.ipa" Payload)
          test -s delivery/The-12-Day-Dancer-Dies-Apri-24-UNSIGNED.ipa

      - name: Package ready-to-open Xcode 15.2 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery
          ROOT=delivery/The-12-Day-Dancer-iPadOS-SIDESTORE-LITE
          mkdir -p "$ROOT"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='delivery' \
            --exclude='ci-resources' \
            --exclude='xcodebuild-sidestore-lite.log' \
            ./ "$ROOT/"

          cp xcodebuild-sidestore-lite.log "$ROOT/XCODEBUILD-SIDESTORE-LITE-GREEN.log"
          cp SOURCE-SITE-COMMIT.txt "$ROOT/SOURCE-SITE-COMMIT.txt"

          cat > "$ROOT/OPEN-ME-FIRST.txt" <<'TXT'
          THE 12 DAY DANCER — SIDESTORE LITE

          Purpose:
            Keep the signed app small enough for SideStore install/refresh.
            The full concert library is NOT baked into the app bundle.

          This exact project was generated and compiled successfully by GitHub Actions.
          CI verified:
            - exact 12-album catalog generated from the concert-house source of truth
            - 229 web M4A + 9 MP4 identities validated against Releases
            - built app contains 0 M4A and 0 MP4
            - only ballerina facade + source marker are bundled as bootstrap resources
            - Documents/ConcertResources is the preferred runtime media location
            - Finder/iPad Files sharing is enabled for The 12 Day Dancer
            - Xcode 15.0/15.2 compatible project format

          On M/S Ventura with Xcode 15.2:
          1. Open The12DayDancer.xcodeproj.
          2. Select The12DayDancer target -> Signing & Capabilities -> Bryan's Personal Team.
          3. Select the physical 12.9-inch iPad.
          4. Product -> Build.
          5. Use Product -> Show Build Folder in Finder and take the Debug-iphoneos app.
          6. Package it as an IPA with Payload/The 12 Day Dancer.app at archive root.
          7. Install that small IPA through SideStore with LocalDevVPN enabled.

          Do NOT add the 3 GB concert library to this app bundle.
          After the SideStore app itself is physically green, the separate ConcertResources
          library will be copied into the app's Documents folder by USB.
          TXT

          ditto -c -k --sequesterRsrc --keepParent \
            "$ROOT" \
            delivery/The-12-Day-Dancer-iPadOS-SIDESTORE-LITE-Xcode15.2-READY.zip
          ls -lh delivery/The-12-Day-Dancer-iPadOS-SIDESTORE-LITE-Xcode15.2-READY.zip

      - name: Upload unsigned SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: The-12-Day-Dancer-Dies-Apri-24-UNSIGNED
          path: delivery/The-12-Day-Dancer-Dies-Apri-24-UNSIGNED.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload SideStore Lite Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: The-12-Day-Dancer-iPadOS-SIDESTORE-LITE-Xcode15.2-READY
          path: delivery/The-12-Day-Dancer-iPadOS-SIDESTORE-LITE-Xcode15.2-READY.zip
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
